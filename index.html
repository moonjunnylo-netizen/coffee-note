<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피 기록 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        cream: "#F6EFE4", latte: "#EADBC6", oat: "#FFFDF8",
        mocha: "#8A5A3C", espresso: "#3B2418", cocoa: "#6B4A36", foam: "#B79E88"
      },
      fontFamily: {
        sans: ['"Noto Sans KR"', '"Apple SD Gothic Neo"', '"Malgun Gothic"', "system-ui", "sans-serif"],
        serif: ['"Gowun Batang"', '"Nanum Myeongjo"', "serif"]
      }
    } }
  };
</script>
<style>
/* Layout: one phone-width column. Form on top, share card below, one big button under it.
   Single warm theme on purpose (beige / brown), so colours are fixed, not theme-switched. */
:root {
  --stage: #EADBC6;   /* backdrop behind the card, also captured */
  --card: #FFFDF8;
  --ink: #3B2418;
  --sub: #8A6F5C;
  --pill: #F3E7D6;
  --line: #E3D3BE;
  color-scheme: light;
}
html, body { background: #F6EFE4; }
/* html2canvas draws text a few px low when images are display:block (Tailwind's default) */
img { display: inline-block !important; vertical-align: top; }

/* ---- share card: fixed 360x450 (4:5). Shown scaled to fit the screen, captured at 3x = 1080x1350 ---- */
#stageWrap { width: 100%; overflow: hidden; border-radius: 16px; }
#scaler { width: 360px; transform-origin: top left; }
#capture { width: 360px; height: 450px; box-sizing: border-box; background: var(--stage); padding: 16px; }
.card {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
  background: var(--card); border-radius: 16px; padding: 12px 12px 10px;
  box-shadow: 0 10px 22px rgba(59, 36, 24, .20), 0 2px 6px rgba(59, 36, 24, .10);
  color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
.card-top { display: flex; gap: 12px; }
.card-photo { flex: none; width: 150px; height: 150px; border-radius: 10px; line-height: 0; overflow: hidden; background: #D9C3A8; }
.card-photo img { width: 150px; height: 150px; border-radius: 10px; }
.card-side { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-top: 2px; }
.roast { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.roast-light  { background: #EBCFA6; color: #5B3A26; }
.roast-medium { background: #B07B4F; color: #FFF8EE; }
.roast-dark   { background: #4A2E1F; color: #F3E3CC; }
.card-tags { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.card-tag { background: var(--pill); color: #5B3A26; font-size: 11.5px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.card-name { margin-top: 12px; padding: 0 2px; }
.card-cafe { font-size: 10.5px; letter-spacing: 2px; color: var(--sub); font-weight: 500; word-break: break-all; }
.card-bean { font-size: var(--bean, 20px); line-height: 1.3; font-weight: 900; margin-top: 2px; word-break: keep-all; overflow-wrap: anywhere; }
.is-empty { color: #C9B6A2; }
.card-pair { margin-top: 7px; padding: 0 2px; font-size: 12.5px; color: #6B4A36; word-break: keep-all; overflow-wrap: anywhere; }
.card-pair b { font-weight: 700; color: var(--ink); }
.card-divider { border-top: 1.5px dashed var(--line); margin: 10px 2px 0; }
.card-review { display: flex; gap: 7px; margin-top: 8px; padding: 0 2px; }
.card-quote { flex: none; font-family: "Gowun Batang", serif; font-size: 34px; line-height: 30px; height: 22px; color: #C9A27E; font-weight: 700; }
.card-review p { margin: 0; font-family: "Gowun Batang", "Nanum Myeongjo", serif; font-size: var(--rv, 14px); line-height: 1.6; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding: 8px 2px 0; font-size: 9.5px; letter-spacing: 1.5px; color: var(--sub); }

.tag-btn[aria-pressed="true"] { background: #8A5A3C; color: #FFF8EE; border-color: #8A5A3C; }
.tag-btn:disabled { opacity: .4; cursor: not-allowed; }
.roast-btn[aria-pressed="true"] { background: #3B2418; color: #FFF8EE; border-color: #3B2418; }
:focus-visible { outline: 2px solid #8A5A3C; outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .tag-btn, .roast-btn { transition: background-color .15s, color .15s, transform .1s; }
  .tag-btn:active, .roast-btn:active { transform: scale(.96); }
}
</style>
</head>
<body class="font-sans text-espresso antialiased">
<main class="mx-auto max-w-md px-4 pb-16 pt-6">

  <header class="mb-5">
    <p class="text-xs font-medium tracking-[0.2em] text-mocha">COFFEE NOTE</p>
    <h1 class="mt-1 font-serif text-2xl font-bold">커피 기록 카드</h1>
    <p class="mt-1 text-sm text-cocoa">오늘 마신 한 잔을 적으면 아래 카드에 바로 담겨요.</p>
  </header>

  <!-- ========== 1. 기록 입력 폼 ========== -->
  <form id="form" class="space-y-5 rounded-2xl border border-latte bg-oat p-4 shadow-sm" autocomplete="off">

    <div>
      <span class="mb-2 block text-sm font-bold">사진</span>
      <div class="flex items-center gap-3">
        <div class="relative h-20 w-20 flex-none overflow-hidden rounded-xl bg-latte">
          <img id="thumb" alt="" class="h-full w-full object-cover">
          <span id="sampleChip" class="absolute bottom-1 left-1 rounded bg-espresso/75 px-1.5 py-0.5 text-[10px] text-cream">샘플</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <label for="photo" class="cursor-pointer rounded-full bg-mocha px-4 py-2 text-sm font-bold text-cream hover:bg-cocoa">사진 고르기</label>
          <input id="photo" type="file" accept="image/*" class="sr-only">
          <button id="photoReset" type="button" class="hidden text-xs text-cocoa underline underline-offset-2">샘플 사진으로 되돌리기</button>
          <p class="text-xs text-foam">가운데를 기준으로 정사각형으로 잘라 넣어요.</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <label class="block text-sm font-bold" for="cafe">카페 이름
        <input id="cafe" type="text" maxlength="30" placeholder="예: 모모스커피"
          class="mt-1.5 w-full rounded-xl border border-latte bg-cream px-3 py-2.5 text-base font-normal placeholder:text-foam">
      </label>
      <label class="block text-sm font-bold" for="bean">원두 이름
        <input id="bean" type="text" maxlength="40" placeholder="예: 에티오피아 구지 함벨라"
          class="mt-1.5 w-full rounded-xl border border-latte bg-cream px-3 py-2.5 text-base font-normal placeholder:text-foam">
      </label>
    </div>

    <div>
      <span class="mb-2 block text-sm font-bold">로스팅 정도</span>
      <div id="roastGroup" class="grid grid-cols-3 gap-2" role="group" aria-label="로스팅 정도"></div>
    </div>

    <div>
      <div class="mb-2 flex items-baseline justify-between">
        <span class="text-sm font-bold">향미</span>
        <span id="tagCount" class="text-xs text-cocoa">0 / 3</span>
      </div>
      <div id="tagGroup" class="flex flex-wrap gap-2" role="group" aria-label="향미 태그, 3개까지"></div>
      <p id="tagHint" class="mt-2 hidden text-xs text-mocha">3개를 다 골랐어요. 바꾸려면 고른 것을 한 번 더 눌러 빼세요.</p>
    </div>

    <label class="block text-sm font-bold" for="dessert">함께한 디저트 <span class="font-normal text-foam">(안 적어도 돼요)</span>
      <input id="dessert" type="text" maxlength="30" placeholder="예: 바스크 치즈케이크"
        class="mt-1.5 w-full rounded-xl border border-latte bg-cream px-3 py-2.5 text-base font-normal placeholder:text-foam">
    </label>

    <div>
      <div class="flex items-baseline justify-between">
        <label class="text-sm font-bold" for="review">총평</label>
        <span id="reviewCount" class="text-xs tabular-nums text-cocoa">0 / 100</span>
      </div>
      <textarea id="review" rows="3" maxlength="100" placeholder="오늘의 커피와 공간은 어땠나요?"
        class="mt-1.5 w-full resize-none rounded-xl border border-latte bg-cream px-3 py-2.5 text-base placeholder:text-foam"></textarea>
    </div>
  </form>

  <!-- ========== 2. 공유용 카드 미리보기 ========== -->
  <section class="mt-8" aria-label="공유용 카드 미리보기">
    <h2 class="mb-3 text-sm font-bold text-cocoa">카드 미리보기</h2>
    <div id="stageWrap">
     <div id="scaler">
      <div id="capture">
        <div class="card">
          <div class="card-top">
            <div class="card-photo"><img id="cardPhoto" alt="커피 사진"></div>
            <div class="card-side">
              <span class="roast" id="cardRoast"></span>
              <div class="card-tags" id="cardTags"></div>
            </div>
          </div>
          <div class="card-name">
            <div class="card-cafe" id="cardCafe"></div>
            <div class="card-bean" id="cardBean"></div>
          </div>
          <div class="card-pair" id="cardPair"></div>
          <div class="card-divider"></div>
          <div class="card-review">
            <span class="card-quote" aria-hidden="true">“</span>
            <p id="cardReview"></p>
          </div>
          <div class="card-foot"><span id="cardDate"></span><span>COFFEE NOTE</span></div>
        </div>
      </div>
     </div>
    </div>

    <button id="shareBtn" type="button"
      class="mt-4 w-full rounded-2xl bg-espresso px-5 py-4 text-base font-bold text-cream shadow-lg shadow-espresso/20 hover:bg-cocoa disabled:opacity-60">
      이미지로 저장 / 공유하기
    </button>
    <p id="msg" class="mt-3 min-h-[1.25rem] text-center text-sm text-cocoa" role="status" aria-live="polite"></p>
  </section>
</main>

<!-- 저장이 막힌 브라우저용: 길게 눌러 저장 -->
<div id="resultModal" class="fixed inset-0 z-20 hidden overflow-y-auto bg-espresso/80 p-4">
  <div class="mx-auto max-w-sm">
    <p class="mb-3 text-center text-sm text-cream">저장이 안 됐다면 이미지를 길게 눌러 저장하세요.</p>
    <img id="resultImg" alt="완성된 커피 기록 카드" class="w-full rounded-xl">
    <button id="resultClose" type="button" class="mt-4 w-full rounded-xl bg-cream py-3 font-bold text-espresso">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ROASTS = [
    { key: "light", ko: "라이트", en: "Light" },
    { key: "medium", ko: "미디엄", en: "Medium" },
    { key: "dark", ko: "다크", en: "Dark" }
  ];
  const TAGS = ["🍋 상큼한 산미", "🍓 베리류 과일", "🍑 달콤한 핵과류", "🌸 화사한 꽃향기", "🍫 다크 초콜릿", "🍯 달달한 캐러멜", "🥜 고소한 견과류", "🥖 구수한 곡물/빵"];
  const MAX_TAGS = 3;

  const state = { photo: "", sample: "", cafe: "", bean: "", roast: "medium", tags: [], dessert: "", review: "" };

  // ---------- 기본 샘플 이미지: 캔버스로 직접 그린 라떼 (외부 이미지 없이 캡처 가능) ----------
  function drawSample() {
    const c = document.createElement("canvas"); c.width = c.height = 1080;
    const x = c.getContext("2d");
    const bg = x.createLinearGradient(0, 0, 1080, 1080);
    bg.addColorStop(0, "#D8B892"); bg.addColorStop(1, "#B98F68");
    x.fillStyle = bg; x.fillRect(0, 0, 1080, 1080);
    x.strokeStyle = "rgba(90,58,38,.10)"; x.lineWidth = 3;           // 나뭇결
    for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(0, 60 + i * 125); x.bezierCurveTo(360, 30 + i * 125, 720, 100 + i * 125, 1080, 60 + i * 125); x.stroke(); }
    const disc = (cx, cy, r, fill, shadow) => {
      x.save(); if (shadow) { x.shadowColor = "rgba(59,36,24,.35)"; x.shadowBlur = 50; x.shadowOffsetY = 22; }
      x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fillStyle = fill; x.fill(); x.restore();
    };
    disc(540, 540, 400, "#F7EFE2", true);                              // 받침
    disc(540, 540, 330, "#EFE3D0");
    disc(540, 540, 285, "#FFFDF8", true);                              // 잔
    const cf = x.createRadialGradient(540, 520, 40, 540, 540, 250);
    cf.addColorStop(0, "#B9824F"); cf.addColorStop(1, "#7A4B2A");
    disc(540, 540, 248, cf);
    x.fillStyle = "#F6E7D2";                                           // 라떼아트 하트
    x.beginPath(); x.moveTo(540, 690);
    x.bezierCurveTo(360, 580, 400, 400, 540, 480);
    x.bezierCurveTo(680, 400, 720, 580, 540, 690); x.fill();
    x.strokeStyle = "#9A6238"; x.lineWidth = 7; x.lineCap = "round";
    [[0, 520, 605], [-46, 500, 560], [46, 500, 560]].forEach(([dx, y1, y2]) => {
      x.beginPath(); x.moveTo(540 + dx, y1); x.quadraticCurveTo(540 + dx * 0.6, (y1 + y2) / 2, 540, y2 + 40); x.stroke();
    });
    x.save(); x.shadowColor = "rgba(59,36,24,.3)"; x.shadowBlur = 20; x.shadowOffsetY = 8;      // 손잡이
    x.strokeStyle = "#FFFDF8"; x.lineWidth = 46; x.beginPath(); x.arc(850, 540, 62, -Math.PI / 2.4, Math.PI / 2.4); x.stroke(); x.restore();
    return c.toDataURL("image/jpeg", 0.9);
  }

  // ---------- 올린 사진을 1:1로 가운데 잘라 넣기 ----------
  function squareCrop(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        const out = Math.min(1080, side);
        const c = document.createElement("canvas"); c.width = c.height = out;
        c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.92));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
      img.src = url;
    });
  }

  // ---------- 입력 컨트롤 만들기 ----------
  $("roastGroup").innerHTML = ROASTS.map((r) =>
    `<button type="button" class="roast-btn rounded-xl border border-latte bg-cream px-2 py-2.5 text-sm font-bold" data-roast="${r.key}" aria-pressed="false">${r.ko}<span class="block text-[11px] font-normal opacity-70">${r.en}</span></button>`).join("");
  $("tagGroup").innerHTML = TAGS.map((t, i) =>
    `<button type="button" class="tag-btn rounded-full border border-latte bg-cream px-3.5 py-2 text-sm" data-tag="${i}" aria-pressed="false">${t}</button>`).join("");

  // ---------- 카드에 반영 ----------
  function setText(el, value, fallback) {
    el.textContent = value || fallback;
    el.classList.toggle("is-empty", !value);
  }
  function render() {
    const photo = state.photo || state.sample;
    $("cardPhoto").src = photo; $("thumb").src = photo;
    $("sampleChip").hidden = !!state.photo;
    $("photoReset").classList.toggle("hidden", !state.photo);

    setText($("cardCafe"), state.cafe, "카페 이름");
    setText($("cardBean"), state.bean, "원두 이름");

    const r = ROASTS.find((x) => x.key === state.roast);
    $("cardRoast").className = "roast roast-" + r.key;
    $("cardRoast").textContent = `${r.ko} · ${r.en}`;
    document.querySelectorAll(".roast-btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.roast === state.roast)));

    const tagsEl = $("cardTags");
    tagsEl.textContent = "";
    state.tags.forEach((i) => { const s = document.createElement("span"); s.className = "card-tag"; s.textContent = TAGS[i]; tagsEl.appendChild(s); });
    tagsEl.style.display = state.tags.length ? "flex" : "none";
    const full = state.tags.length >= MAX_TAGS;
    document.querySelectorAll(".tag-btn").forEach((b) => {
      const on = state.tags.includes(+b.dataset.tag);
      b.setAttribute("aria-pressed", String(on));
      b.disabled = full && !on;
    });
    $("tagCount").textContent = `${state.tags.length} / ${MAX_TAGS}`;
    $("tagHint").classList.toggle("hidden", !full);

    const pair = $("cardPair");
    pair.style.display = state.dessert ? "block" : "none";       // 안 적으면 영역째 숨김
    pair.textContent = "";
    if (state.dessert) { pair.append("🍰 Pairing: "); const b = document.createElement("b"); b.textContent = state.dessert; pair.appendChild(b); }

    setText($("cardReview"), state.review, "오늘의 커피와 공간에 대한 한마디가 여기에 들어가요.");
    $("reviewCount").textContent = `${state.review.length} / 100`;
    fit();
  }

  // 4:5 칸에 넘치면 총평 글자부터 줄이고, 그래도 넘치면 원두 이름을 줄인다
  function fit() {
    const card = document.querySelector(".card");
    let rv = 14, bean = 20;
    const apply = () => { card.style.setProperty("--rv", rv + "px"); card.style.setProperty("--bean", bean + "px"); };
    apply();
    while (card.scrollHeight > card.clientHeight + 1 && (rv > 11 || bean > 15)) {
      if (rv > 11) rv -= 0.5; else bean -= 1;
      apply();
    }
  }
  // 화면 폭에 맞게 카드를 줄여 보여 준다 (저장은 원래 크기로)
  function scaleStage() {
    const w = $("stageWrap").clientWidth, s = w / 360;
    $("scaler").style.transform = `scale(${s})`;
    $("stageWrap").style.height = 450 * s + "px";
  }
  window.addEventListener("resize", scaleStage);

  // ---------- 이벤트 ----------
  const bind = (id, key) => $(id).addEventListener("input", (e) => {
    state[key] = key === "review" ? e.target.value.slice(0, 100).trim() === "" ? "" : e.target.value.slice(0, 100) : e.target.value.trim();
    render();
  });
  bind("cafe", "cafe"); bind("bean", "bean"); bind("dessert", "dessert"); bind("review", "review");

  $("roastGroup").addEventListener("click", (e) => {
    const b = e.target.closest("[data-roast]"); if (!b) return;
    state.roast = b.dataset.roast; render();
  });
  $("tagGroup").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tag]"); if (!b || b.disabled) return;
    const i = +b.dataset.tag, at = state.tags.indexOf(i);
    if (at >= 0) state.tags.splice(at, 1);
    else if (state.tags.length < MAX_TAGS) state.tags.push(i);
    render();
  });
  $("photo").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try { state.photo = await squareCrop(f); say(""); render(); }
    catch { say("이 사진은 열 수 없어요. JPG나 PNG 사진으로 다시 골라 주세요."); }
  });
  $("photoReset").addEventListener("click", () => { state.photo = ""; render(); });
  $("form").addEventListener("submit", (e) => e.preventDefault());
  $("resultClose").addEventListener("click", () => $("resultModal").classList.add("hidden"));

  const say = (t) => { $("msg").textContent = t; };

  // ---------- 캡처 → 공유 또는 저장 ----------
  // Claude 아티팩트 안에서는 브라우저 다운로드가 막혀 있어, 그 안에서만 Claude의 저장 기능을 쓴다.
  const claudeSave = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);

  async function capture() {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const el = $("capture");
    const canvas = await html2canvas(el, {
      scale: 3, width: 360, height: 450,            // 1080 x 1350 (4:5)
      onclone: (doc) => { doc.getElementById("scaler").style.transform = "none"; },
      backgroundColor: getComputedStyle(el).backgroundColor,
      useCORS: true, logging: false
    });
    return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error("blob"))), "image/png"));
  }

  $("shareBtn").addEventListener("click", async () => {
    const btn = $("shareBtn");
    btn.disabled = true; btn.textContent = "카드를 만드는 중…"; say("");
    try {
      const blob = await capture();
      const d = new Date();
      const name = `coffee-card-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.png`;
      const file = new File([blob], name, { type: "image/png" });

      // 1) 모바일: 공유 시트 (카카오톡, 인스타그램 등)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "커피 기록 카드", text: [state.cafe, state.bean].filter(Boolean).join(" · ") });
          say("공유 창을 열었어요."); return;
        } catch (err) {
          if (err && err.name === "AbortError") { say(""); return; }   // 사용자가 닫음
          // 그 밖의 실패는 저장으로 넘어감
        }
      }
      // 2) Claude 아티팩트 안: Claude 저장 창
      const dl = await claudeSave;
      if (dl) {
        try { await dl.save({ filename: name, data: blob }); say("이미지를 저장했어요."); return; }
        catch (err) { if (err && err.code === "declined") { say("저장을 취소했어요."); return; } }
      }
      // 3) PC 또는 공유를 지원하지 않는 브라우저: 바로 다운로드
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      say("이미지를 저장했어요. 다운로드 폴더를 확인하세요.");
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || dl === null && window.claude) {
        $("resultImg").src = url; $("resultModal").classList.remove("hidden");   // 앱 안 브라우저처럼 다운로드가 막힌 곳
      } else {
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
    } catch (err) {
      say("카드를 이미지로 만들지 못했어요. 한 번 더 눌러 주세요.");
    } finally {
      btn.disabled = false; btn.textContent = "이미지로 저장 / 공유하기";
    }
  });

  // ---------- 시작 ----------
  state.sample = drawSample();
  $("cardDate").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  scaleStage();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
